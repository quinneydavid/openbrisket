[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbrisket"
version = "0.11.0"
description = "BBQ as Code: recipes, rubs and stacks in git, a cook log with history, and notes when the meat needs you."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "David Quinney"}]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
openbrisket = "openbrisket.cli:main"

[tool.setuptools]
packages = ["openbrisket"]

[tool.setuptools.package-data]
openbrisket = ["web/*"]
