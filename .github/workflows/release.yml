name: release

# Push a tag such as v0.12.0 and the image is built for amd64 and arm64 and published to
# ghcr.io/<owner>/openbrisket with that version and `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in the code
        run: |
          code=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('openbrisket/__init__.py').read()).group(1))")
          test "v$code" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $code"; exit 1; }
      - name: Smoke test
        run: |
          pip install PyYAML
          python -m openbrisket validate recipes
          python -m unittest discover -s tests -t .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
