name: smoke-test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Recipes and rubs are valid and food-safe
        run: python -m openbrisket validate recipes
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
