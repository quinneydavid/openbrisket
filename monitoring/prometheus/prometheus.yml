# Prometheus for OpenBrisket. Used by `docker compose --profile monitoring up -d`; for a Prometheus you
# already run, copy the scrape job below and alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: openbrisket
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/token    # a read token minted on the Settings page, in monitoring/prometheus/token
    static_configs:
      - targets: ["openbrisket:8321"]
